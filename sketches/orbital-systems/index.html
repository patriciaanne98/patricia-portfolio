
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Systems</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #030915;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      cursor: grab;
    }


#orbital-controls {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
  width: 150px;
  padding: 12px;
  background: rgba(7, 20, 38, 0.88);
  border: 1px solid rgba(128, 169, 201, 0.25);
  border-radius: 6px;
  backdrop-filter: blur(12px);
  font-family: monospace;
  font-size: 10px;
  color: #c7e6ff;
}

#orbital-controls > label {
  display: block;
  letter-spacing: 1.5px;
  color: #80a9c9;
  margin-bottom: 8px;
}

#view-mode {
  width: 100%;
  padding: 8px;
  background: #0c1d32;
  color: #c7e6ff;
  border: 1px solid #36566e;
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  cursor: pointer;
}

#category-filters {
  margin-top: 15px;
}

#category-filters label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 10px 0;
  cursor: pointer;
}

#category-filters input {
  accent-color: #51dfb3;
  margin: 0;
}

@media (max-width: 500px) {
  #orbital-controls {
    top: 12px;
    right: 12px;
    width: 120px;
    padding: 8px;
    font-size: 9px;
  }
}

  </style>
</head>

<body>

  <div id="orbital-controls">

    <label for="view-mode">VIEW MODE</label>

    <select id="view-mode">
  <option value="all" selected>Full Catalog</option>
  <option value="category">By Category</option>
  <option value="explore">Explore</option>
</select>

    <div id="category-filters" hidden>

      <label>
        <input type="checkbox" value="stations" checked>
        <span style="color:#ffffff">●</span>
        Space Stations
      </label>

      <label>
        <input type="checkbox" value="starlink">
        <span style="color:#51dfb3">●</span>
        Starlink
      </label>

      <label>
        <input type="checkbox" value="navigation" checked>
        <span style="color:#e6bc64">●</span>
        Navigation
      </label>

      <label>
        <input type="checkbox" value="weather" checked>
        <span style="color:#b69bff">●</span>
        Weather
      </label>

      <label>
        <input type="checkbox" value="geostationary">
        <span style="color:#65cfff">●</span>
        Geostationary
      </label>

      <label>
        <input type="checkbox" value="other">
        <span style="color:#8499b5">●</span>
        Other Satellites
      </label>

    </div>

  </div>

  <script type="module" src="sketch.js"></script>

</body>
</html>
